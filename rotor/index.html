<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>R.O.T.O.R. Rescue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
/* Layout: one C64 monitor in the middle of a dark room, controls legend underneath. */
:root {
  color-scheme: dark;
  --room: #0b0a12;        /* the room around the monitor */
  --bezel: #1a1724;       /* monitor frame */
  --border: #352879;      /* C64 border blue */
  --ink: #b8c76f;         /* C64 yellow-green text */
  --ink-dim: #6c5eb5;     /* C64 light blue */
  --key: #2a2638;
  --font-pixel: "VT323", "Courier New", ui-monospace, monospace;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--room); color: var(--ink);
  font-family: var(--font-pixel); font-size: 20px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding-inline: 16px; padding-block: 12px; box-sizing: border-box; overflow: hidden;
  -webkit-user-select: none; user-select: none; touch-action: none;
}
#monitor {
  background: var(--border); padding: clamp(6px, 2.2vmin, 22px);
  border-radius: 6px; box-shadow: 0 0 0 6px var(--bezel), 0 18px 60px rgba(0,0,0,.6);
  max-width: 100%; box-sizing: border-box;
}
canvas#screen {
  display: block; image-rendering: pixelated; image-rendering: crisp-edges;
  background: #000; max-width: 100%;
}
#legend {
  margin-top: 14px; display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: center;
  color: var(--ink-dim); letter-spacing: .04em; line-height: 1.1; max-width: 900px;
}
#legend span { white-space: nowrap; }
kbd {
  font-family: var(--font-pixel); font-size: 18px; color: var(--ink);
  background: var(--key); border-radius: 3px; padding: 0 6px; border-bottom: 2px solid #000;
}
#touch { display: none; width: 100%; max-width: 640px; margin-top: 10px; justify-content: space-between; gap: 12px; }
#touch .pad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(2, 52px); gap: 6px; }
#touch button {
  font-family: var(--font-pixel); font-size: 22px; color: var(--ink); background: var(--key);
  border: 0; border-bottom: 3px solid #000; border-radius: 8px; touch-action: none;
}
#touch button.on { background: var(--ink-dim); color: #000; }
#touch .fire { width: 110px; height: 110px; border-radius: 50%; font-size: 26px; }
@media (pointer: coarse) {
  #touch { display: flex; }
  #legend { display: none; }
}
</style>
</head>
<body>
<div id="monitor"><canvas id="screen" width="320" height="200" aria-label="R.O.T.O.R. Spielfeld"></canvas></div>
<div id="legend">
  <span><kbd>&larr;</kbd><kbd>&rarr;</kbd> laufen / fliegen</span>
  <span><kbd>&uarr;</kbd> Rotor (kurz: schweben, lang: steigen)</span>
  <span><kbd>&darr;</kbd> Dynamit legen (am Boden)</span>
  <span><kbd>Leertaste</kbd> Helm-Laser</span>
  <span><kbd>P</kbd> Pause</span>
  <span><kbd>M</kbd> Ton</span>
</div>
<div id="touch">
  <div class="pad">
    <span></span><button data-k="up" aria-label="Rotor">&#9650;</button><span></span>
    <button data-k="left" aria-label="Links">&#9664;</button><button data-k="down" aria-label="Dynamit">&#9660;</button><button data-k="right" aria-label="Rechts">&#9654;</button>
  </div>
  <button class="fire" data-k="fire" aria-label="Laser">FIRE</button>
</div>

/* =====================================================================
   R.O.T.O.R. – Rescue Operation Through Old Rockshafts
   A C64-style homage to the 1984 prop-pack cave rescue genre.
   320x200 virtual screen, 16 colour C64 palette, multicolour (2x1) pixels.
   ===================================================================== */

const VW = 320, VH = 200, PH = 160, TS = 16, SC = 20, SR = 10;

const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ------------------------------------------------------------------ */
/* Scaling: integer zoom where possible                                */
/* ------------------------------------------------------------------ */
function resize() {
  const touch = matchMedia('(pointer: coarse)').matches;
  const availW = window.innerWidth - 32 - 44;
  const availH = window.innerHeight - (touch ? 200 : 110) - 44;
  let s = Math.min(availW / VW, availH / VH);
  s = s >= 1 ? Math.floor(s) : Math.max(0.5, s);
  cv.style.width = Math.round(VW * s) + 'px';
  cv.style.height = Math.round(VH * s) + 'px';
}
window.addEventListener('resize', resize);
resize();

};
function textW(s, sc = 1) { return s.length * 6 * sc - sc; }
function text(s, x, y, col, sc = 1, shadow = false) {
  s = String(s).toUpperCase();
  if (shadow) text(s, x + sc, y + sc, BLACK, sc, false);
  ctx.fillStyle = PAL[col];
  for (let i = 0; i < s.length; i++) {
    const g = FONT[s[i]] || FONT[' '];
    for (let r = 0; r < 7; r++) {
      const bits = g[r];
      if (!bits) continue;
      for (let b = 0; b < 5; b++) if (bits & (16 >> b)) ctx.fillRect(x + b * sc, y + r * sc, sc, sc);
    }
    x += 6 * sc;
  }
}
function textC(s, y, col, sc = 1, shadow = false) { text(s, Math.round((VW - textW(s, sc)) / 2), y, col, sc, shadow); }

/* ------------------------------------------------------------------ */
/* Sprites (multicolour: each character = one 2x1 "fat" pixel)         */
/* ------------------------------------------------------------------ */
function makeSprite(rows, map) {
  const fw = Math.max(...rows.map(r => r.length));
  const w = fw * 2, h = rows.length;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  rows.forEach((row, y) => {
    for (let i = 0; i < row.length; i++) {
      const ci = map[row[i]];
      if (ci === undefined) continue;
      g.fillStyle = PAL[ci]; g.fillRect(i * 2, y, 2, 1);
    }
  });
  const f = document.createElement('canvas'); f.width = w; f.height = h;
  const fg = f.getContext('2d'); fg.translate(w, 0); fg.scale(-1, 1); fg.drawImage(c, 0, 0);
  return { n: c, f, w, h };
}
function drawSpr(s, x, y, flip) { ctx.drawImage(flip ? s.f : s.n, Math.round(x), Math.round(y)); }

const DRAIN = 1 / (60 * 95);     // full power lasts ~95 s

function hash(x, y, s) {
  let n = Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 1442695041);
  n = Math.imul(n ^ (n >>> 13), 1274126177);

}

function buildLevel(idx) {
  const def = LEVELS[idx];
  const rows = def.grid.length, cols = def.grid[0].length;
  const mw = cols * SC, mh = rows * SR;
  const g = new Array(mw * mh).fill('#');
  for (let sy = 0; sy < rows; sy++) for (let sx = 0; sx < cols; sx++) {
    const scr = def.grid[sy][sx];
    if (!scr) continue;
    for (let r = 0; r < SR; r++) for (let c = 0; c < SC; c++) g[(sy * SR + r) * mw + sx * SC + c] = scr[r][c];
  }
  const lv = { idx, def, mw, mh, cols, rows, g, walls: [], wallAt: new Int16Array(mw * mh).fill(-1),

               dyn: null, blasts: [], parts: [], flash: 0, msgT: 150, rock: def.rock };

  const solid = ch => ch === '#' || ch === 'M';

  for (let r = 0; r < mh; r++) for (let c = 0; c < mw; c++) {
    const ch = g[r * mw + c], x = c * TS, y = r * TS, scr = Math.floor(c / SC) + ',' + Math.floor(r / SR);

      case 'P': start = { x: x + 3, y: y - 2 }; g[r * mw + c] = '.'; break;
      case 'X': lv.miner = { x: x, y: (r + 1) * TS - 18, w: 16, h: 18 }; g[r * mw + c] = '.'; break;
      case '!': lv.lanterns.push({ x: x, y: y + 2, w: 16, h: 8, on: true, scr }); g[r * mw + c] = '.'; break;
      case 'T': g[r * mw + c] = '~'; lv.enemies.push({ type: 'tentacle', x: x + 4, base: y + 2, ph: hash(c, r, 7) * 6, scr, hgt: 0 }); break;
      case 'S': {

// rock texture: stippled multicolour pixels with lit top edges
function prerender(lv) {

/* ------------------------------------------------------------------ */
/* Collision helpers                                                   */
/* ------------------------------------------------------------------ */
function overlap(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

  const c0 = Math.floor(x / TS), c1 = Math.floor((x + w - 0.01) / TS);
  const r0 = Math.floor(y / TS), r1 = Math.floor((y + h - 0.01) / TS);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (fn(L.at(c, r), c, r)) return true;
  return false;
}
function blocked(x, y, w, h) {
  return tilesIn(x, y, w, h, (t, c) => {
    if (t === '#' || t === 'M') return true;
    if (t === 'W' || t === 'm') { const wx = c * TS + 4; return x < wx + 8 && x + w > wx; }
    return false;
  });
}
function touchesMagma(x, y, w, h) {
  return tilesIn(x - 1, y - 1, w + 2, h + 2, (t, c) => {
    if (t === 'M') return true;
    if (t === 'm') { const wx = c * TS + 4; return x - 1 < wx + 8 && x + w + 1 > wx; }
    return false;
  });
}

  return tilesIn(x + 2, y + h - 3, w - 4, 3, (t, c, r) => t === '~' && y + h > r * TS + 3);
}
function moveAxis(dx, dy) {
  let rem = dx || dy;
  const s = Math.sign(rem);
  let hit = false;
  while (Math.abs(rem) > 0.0001) {
    const step = s * Math.min(1, Math.abs(rem));
    const nx = H.x + (dx ? step : 0), ny = H.y + (dy ? step : 0);
    if (blocked(nx, ny, H.w, H.h)) { hit = true; break; }
    H.x = nx; H.y = ny; rem -= step;

  return hit;
}

    case 'snake': {
      const hx = e.ox + e.dir * e.ext;
      return e.dir > 0 ? { x: e.ox, y: e.y, w: Math.max(1, e.ext + 2), h: 6 } : { x: hx - 2, y: e.y, w: Math.max(1, e.ext + 2), h: 6 };
    }
    case 'tentacle': return { x: e.x, y: e.base - e.hgt, w: 8, h: Math.max(1, e.hgt) };
  }
}
function updateEnemy(e, t) {
  switch (e.type) {
    case 'spider': {
      const mid = (e.min + e.max) / 2, amp = (e.max - e.min) / 2;
      e.y = mid + Math.sin(t * 0.03 + e.ph) * amp;
      break;
    }
    case 'bat': case 'moth': {
      const nx = e.x + e.vx;
      const left = L.sx * VW, right = left + VW;
      if (blocked(nx, e.y, 16, 6) || nx < left || nx + 16 > right) e.vx = -e.vx; else e.x = nx;
      const amp = e.type === 'bat' ? 3 : 9, spd = e.type === 'bat' ? 0.09 : 0.05;
      const ny = e.by + Math.sin(t * spd + e.ph) * amp;
      if (!blocked(e.x, ny, 16, 6)) e.y = ny;
      break;
    }
    case 'snake': {
      const p = (t * 0.022 + e.ph) % (Math.PI * 2);
      e.ext = Math.max(0, Math.sin(p)) * 22;
      break;
    }
    case 'tentacle': {
      e.hgt = Math.max(0, Math.sin(t * 0.02 + e.ph) * 1.3 - 0.3) * 40;
      break;
    }
  }
}
function drawEnemy(e, ox, oy, t) {
  const x = Math.round(e.x - ox), f = (t >> 3) & 1;
  switch (e.type) {
    case 'spider': {
      ctx.fillStyle = PAL[LGREY];
      ctx.fillRect(x + 7, e.top - oy, 1, Math.max(0, e.y - e.top + 1));
      drawSpr(spiderSpr[(t >> 4) & 1], x, e.y - oy);
      break;
    }
    case 'bat': drawSpr(batSpr[f], x, e.y - oy); break;
    case 'moth': drawSpr(mothSpr[(t >> 2) & 1], x, e.y - oy, e.vx < 0); break;
    case 'snake': {
      if (e.ext < 1) break;
      const y = e.y - oy;
      for (let i = 0; i < e.ext; i += 2) {
        const sx = e.dir > 0 ? e.ox + i : e.ox - i - 2;
        const wig = Math.round(Math.sin(i * 0.5 + t * 0.2));
        ctx.fillStyle = PAL[(i >> 1) & 1 ? GREEN : LGREEN];
        ctx.fillRect(sx - ox, y + 1 + wig, 2, 4);
      }
      const hx = e.dir > 0 ? e.ox + e.ext - 4 : e.ox - e.ext;
      ctx.fillStyle = PAL[LGREEN]; ctx.fillRect(hx - ox, y, 6, 6);
      ctx.fillStyle = PAL[BLACK]; ctx.fillRect(hx - ox + (e.dir > 0 ? 4 : 0), y + 1, 2, 1);
      if ((t >> 2) & 1) { ctx.fillStyle = PAL[RED]; ctx.fillRect(e.dir > 0 ? hx - ox + 6 : hx - ox - 3, y + 4, 3, 1); }
      break;
    }
    case 'tentacle': {
      if (e.hgt < 1) break;
      for (let i = 0; i < e.hgt; i += 3) {
        const wob = Math.round(Math.sin(t * 0.12 + i * 0.25) * 3 * (i / 40));
        const wdt = i > e.hgt - 6 ? 4 : 8;
        ctx.fillStyle = PAL[(i / 3) & 1 ? PURPLE : LRED];
        ctx.fillRect(x + wob + (8 - wdt) / 2, e.base - oy - i - 3, wdt, 3);
      }
      break;
    }
  }
}

/* ------------------------------------------------------------------ */
/* Update                                                              */
/* ------------------------------------------------------------------ */
function update() {
  G.t++;
  pollInput();
  if (G.paused) return;
  switch (G.state) {
    case 'title': updateTitle(); break;
    case 'play': updatePlay(); break;
    case 'dying':
      H.deadT++; updateParticles();
      if (H.deadT > 100) respawn();
      break;
    case 'rescue': updateRescue(); break;
    case 'gameover':
      G.timer++; updateParticles();
      if (G.timer > 60 && (pressed('fire') || pressed('start'))) G.state = 'title';
      break;
  }
}
function updateTitle() {
  if (pressed('left') || pressed('down')) G.startSel = (G.startSel + LEVELS.length - 1) % LEVELS.length;
  if (pressed('right') || pressed('up')) G.startSel = (G.startSel + 1) % LEVELS.length;
  if (pressed('fire') || pressed('start')) newGame();
}
function togglePause() {
  if (G.state === 'play' || G.state === 'dying' || G.state === 'rescue') G.paused = !G.paused;
}

function updatePlay() {
  const I = input;
  const t = G.t;
  if (L.msgT > 0) L.msgT--;
  if (!L.started && (I.left || I.right || I.up || I.down || I.fire)) L.started = true;
  if (L.started) H.power -= DRAIN * (1 + 0.2 * G.loop);

  // horizontal
  let dx = 0;
  if (I.left) { dx = -WALK; H.face = -1; } else if (I.right) { dx = WALK; H.face = 1; }
  // rotor: spin up first, then hover, then climb
  if (I.up) {
    H.spin = Math.min(1, H.spin + 1 / 16);
    if (H.spin >= 1) H.vy = Math.max(H.vy - 0.14, -1.3);
    else if (!H.onGround) H.vy = Math.min(H.vy, 0.6) * 0.82;
  } else {
    H.spin = Math.max(0, H.spin - 1 / 28);
    H.vy = Math.min(H.vy + 0.1, 1.8);
  }
  if (H.spin > 0) H.rotT += H.spin * 0.6;

  if (dx) moveAxis(dx, 0);
  if (moveAxis(0, H.vy)) H.vy = 0;
  H.onGround = blocked(H.x, H.y + 1, H.w, H.h);
  if (H.onGround && dx) H.walkT++;
  H.x = Math.max(0, Math.min(L.mw * TS - H.w, H.x));
  H.y = Math.max(0, Math.min(L.mh * TS - H.h, H.y));
  setScreenFromHero(false);

  const key = scrKey();
  const hr = { x: H.x + 1, y: H.y + 1, w: H.w - 2, h: H.h - 2 };

  // dynamite
  if (pressed('down') && H.onGround && !L.dyn && H.dyn > 0) {
    H.dyn--;
    const sx = H.face > 0 ? H.x + H.w + 1 : H.x - 5;
    L.dyn = { x: sx, y: H.y + H.h - 8, t: 70 };
    SFX.stick();
  }
  if (L.dyn) {
    L.dyn.t--;
    if (L.dyn.t <= 0) explode(L.dyn);
  }

  // laser
  H.firing = I.fire;
  H.beam = null;
  if (H.firing) {
    const by = H.y + 3;
    const x0 = H.face > 0 ? H.x + H.w : H.x - 1;
    const left = L.sx * VW, right = left + VW;
    let len = 0, wall = null;
    for (; len < LASER_LEN; len++) {
      const px = x0 + H.face * len;
      if (px < left || px >= right) break;
      const c = Math.floor(px / TS), r = Math.floor(by / TS), tch = L.at(c, r);
      if (tch === '#' || tch === 'M') break;
      if ((tch === 'W' || tch === 'm') && px >= c * TS + 4 && px < c * TS + 12) { wall = L.walls[L.wallAt[r * L.mw + c]]; break; }
    }
    const bx = H.face > 0 ? x0 : x0 - len;
    H.beam = { x: bx, y: by - 1, w: Math.max(1, len), h: 3 };
    if (wall) {
      wall.hp--; wall.hot = 4; H.power -= DRAIN * 1.5;
      if (wall.hp <= 0) destroyWall(wall);
    }
    for (const e of L.enemies) if (!e.dead && e.scr === key && overlap(H.beam, enemyRect(e))) killEnemy(e);
    for (const l of L.lanterns) if (l.on && l.scr === key && overlap(H.beam, l)) douseLantern(l);
  }
  for (const w of L.walls) if (w.hot > 0) w.hot--;

  // enemies
  for (const e of L.enemies) {
    if (e.dead || e.scr !== key) continue;
    updateEnemy(e, t);
    if (overlap(hr, enemyRect(e))) { killHero(); return; }
  }
  for (const l of L.lanterns) if (l.on && l.scr === key && overlap(hr, l)) douseLantern(l);

  updateParticles();
  if (L.flash > 0) L.flash--;

  // hazards
  if (touchesMagma(H.x, H.y, H.w, H.h)) { killHero(); return; }
  if (inWater(H.x, H.y, H.w, H.h)) { SFX.splash(); killHero(); return; }
  if (H.power <= 0) { H.power = 0; killHero(); return; }

  // rescue
  if (L.miner && overlap(hr, L.miner)) {
    G.state = 'rescue'; G.timer = 0; G.tally = 0; H.firing = false; H.beam = null;
    addScore(1000); SFX.rescue();
  }
}
function explode(d) {
  L.dyn = null;
  const cx = d.x + 2, bottom = d.y + 8;
  L.blasts.push({ x: cx, y: bottom - 10, t: 0 });
  if (!reduceMotion) L.flash = 10;
  SFX.boom();
  const zone = { x: cx - 26, y: bottom - 52, w: 52, h: 56 };
  for (const w of L.walls) if (w.alive && overlap(zone, w)) destroyWall(w);
  const key = scrKey();
  for (const e of L.enemies) if (!e.dead && e.scr === key && overlap(zone, enemyRect(e))) killEnemy(e);
  const danger = { x: cx - 18, y: bottom - 40, w: 36, h: 44 };
  if (overlap(danger, { x: H.x, y: H.y, w: H.w, h: H.h })) killHero();
}
function updateParticles() {
  for (const p of L.parts) { p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.life--; }
  L.parts = L.parts.filter(p => p.life > 0);
  for (const b of L.blasts) b.t++;
  L.blasts = L.blasts.filter(b => b.t < 22);
}
function updateRescue() {
  G.timer++;
  updateParticles();
  if (G.timer < 70) return;
  if (H.power > 0) {
    if (G.timer % 2 === 0) { H.power = Math.max(0, H.power - 0.01); addScore(5 * Math.min(levelNo(), 20)); SFX.tick(); }
    return;
  }
  if (H.dyn > 0) {
    if (G.timer % 14 === 0) { H.dyn--; addScore(50); tone(200, 120, 0.08, 'square', 0.2); }
    return;
  }
  G.tally++;
  if (G.tally > 70) {
    G.levelIdx++;
    if (G.levelIdx >= LEVELS.length) { G.levelIdx = 0; G.loop++; }
    startLevel();
  }
}

/* ------------------------------------------------------------------ */
/* Render                                                              */
/* ------------------------------------------------------------------ */
function render() {
  ctx.fillStyle = PAL[0]; ctx.fillRect(0, 0, VW, VH);
  if (G.state === 'title') renderTitle();
  else {
    renderPlayfield();
    renderHUD();
    if (G.state === 'gameover') {
      ctx.fillStyle = PAL[0]; ctx.fillRect(80, 58, 160, 44);
      ctx.fillStyle = PAL[RED]; ctx.fillRect(80, 58, 160, 2); ctx.fillRect(80, 100, 160, 2);
      textC('GAME OVER', 66, (G.t >> 3) & 1 ? WHITE : LRED, 2);
      textC('FEUER: ZURUECK ZUM TITEL', 88, LBLUE);
    }
  }
  if (G.paused) {
    ctx.fillStyle = PAL[0]; ctx.fillRect(110, 70, 100, 20);
    textC('- PAUSE -', 77, WHITE);
  }
}

function renderPlayfield() {
  const ox = L.sx * VW, oy = L.sy * PH, t = G.t, key = scrKey();
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, VW, PH); ctx.clip();
  const lit = !!(L.dyn || L.blasts.length);
  const dark = L.dark.has(key) && !lit;
  if (L.flash > 0 && (L.flash & 2)) { ctx.fillStyle = PAL[L.flash > 5 ? WHITE : L.rock[2]]; ctx.fillRect(0, 0, VW, PH); }
  else if (!dark) ctx.drawImage(L.pre, ox, oy, VW, PH, 0, 0, VW, PH);

  // animated tiles of this screen
  const c0 = L.sx * SC, r0 = L.sy * SR;
  for (let r = 0; r < SR; r++) for (let c = 0; c < SC; c++) {
    const ch = L.at(c0 + c, r0 + r), X = c * TS, Y = r * TS;
    if (ch === 'M') drawMagma(X, Y, TS, TS, c0 + c, r0 + r, t);
    else if (ch === 'm') {
      const w = L.walls[L.wallAt[(r0 + r) * L.mw + c0 + c]];
      drawMagma(X + 4, Y, 8, TS, c0 + c, r0 + r, t);
      if (w && w.hot && (t & 1)) { ctx.fillStyle = PAL[WHITE]; ctx.fillRect(X + 4, Y, 8, TS); }
    } else if (ch === 'W' && !dark) {
      const w = L.walls[L.wallAt[(r0 + r) * L.mw + c0 + c]];
      drawBreakable(X + 4, Y, w, t, r0 + r);
    } else if (ch === '~' && !dark) drawWater(X, Y, c0 + c, r0 + r, t);
  }

  for (const l of L.lanterns) if (l.scr === key) drawSpr(l.on ? lanternOn : lanternOff, l.x - ox, l.y - oy);
  if (L.miner && Math.floor(L.miner.x / VW) === L.sx && Math.floor(L.miner.y / PH) === L.sy) {
    const fr = G.state === 'rescue' ? 1 + ((t >> 3) & 1) : ((t >> 5) % 4 === 0 ? 1 : 0);
    drawSpr(minerSpr[fr], L.miner.x - ox, L.miner.y - oy, H.x < L.miner.x);
  }
  for (const e of L.enemies) if (!e.dead && e.scr === key) drawEnemy(e, ox, oy, t);

  // dynamite
  if (L.dyn) {
    const dx = L.dyn.x - ox, dy = L.dyn.y - oy;
    ctx.fillStyle = PAL[RED]; ctx.fillRect(dx, dy + 1, 4, 7);
    ctx.fillStyle = PAL[LRED]; ctx.fillRect(dx, dy + 1, 2, 7);
    ctx.fillStyle = PAL[WHITE]; ctx.fillRect(dx, dy + 3, 4, 1);
    ctx.fillStyle = PAL[GREY]; ctx.fillRect(dx + 2, dy - 1, 1, 2);
    ctx.fillStyle = PAL[(t >> 1) & 1 ? YELLOW : WHITE]; ctx.fillRect(dx + 1 + (t & 1), dy - 3, 2, 2);
  }

  // hero
  if (G.state !== 'dying' || ((H.deadT >> 2) & 1) === 0 && H.deadT < 50) drawHero(ox, oy, t);

  // laser beam: flickering dotted line
  if (H.beam) {
    const b = H.beam;
    for (let i = 0; i < b.w; i += 2) {
      const ci = ((i >> 1) + t) % 3;
      ctx.fillStyle = PAL[[WHITE, YELLOW, LRED][ci]];
      ctx.fillRect(b.x - ox + i, b.y + 1 + ((i + t) & 1 ? 0 : (t & 2 ? -1 : 1)) * 0, 2, 1);
    }
  }

  // explosions
  for (const b of L.blasts) {
    const rad = Math.min(26, 4 + b.t * 2);
    for (let i = 0; i < 70; i++) {
      const a = hash(i, b.t, 1) * Math.PI * 2, d = Math.sqrt(hash(i, b.t, 2)) * rad;
      const px = b.x - ox + Math.cos(a) * d, py = b.y - oy + Math.sin(a) * d * 0.9;
      ctx.fillStyle = PAL[[WHITE, YELLOW, ORANGE, LRED][(i + b.t) & 3]];
      ctx.fillRect(Math.round(px / 2) * 2, Math.round(py), 2, 2);
    }
  }
  for (const p of L.parts) { ctx.fillStyle = PAL[p.col]; ctx.fillRect(Math.round((p.x - ox) / 2) * 2, Math.round(p.y - oy), 2, 1); }

  // level banner
  if (L.msgT > 0 && G.state === 'play') {
    const msg = 'LEVEL ' + levelNo() + (G.loop ? '  PRO' : '');
    ctx.fillStyle = PAL[0]; ctx.fillRect(Math.round((VW - textW(msg, 2)) / 2) - 6, 66, textW(msg, 2) + 12, 26);
    textC(msg, 72, [WHITE, YELLOW, LGREEN, CYAN][(t >> 3) & 3], 2);
  }
  if (G.state === 'rescue') {
    ctx.fillStyle = PAL[0]; ctx.fillRect(70, 20, 180, 30);
    textC('KUMPEL GERETTET!', 25, (t >> 3) & 1 ? YELLOW : WHITE);
    textC(G.timer < 70 ? '+1000' : 'BONUS', 37, LGREEN);
  }
  ctx.restore();
}

function drawMagma(X, Y, w, h, c, r, t) {
  ctx.fillStyle = PAL[RED]; ctx.fillRect(X, Y, w, h);
  const ph = t >> 3;
  for (let py = 0; py < h; py += 2) for (let px = 0; px < w; px += 2) {
    const v = hash(c * 8 + (px >> 1), r * 8 + (py >> 1) + ph, 5);
    if (v > 0.55) { ctx.fillStyle = PAL[v > 0.9 ? YELLOW : v > 0.75 ? ORANGE : LRED]; ctx.fillRect(X + px, Y + py, 2, 2); }
  }
}
function drawBreakable(X, Y, w, t, r) {
  const hot = w && w.hot;
  const dmg = w ? 1 - w.hp / WALL_HP : 0;
  const base = hot ? ((t >> 1) & 1 ? YELLOW : LRED) : LGREY;
  ctx.fillStyle = PAL[base]; ctx.fillRect(X, Y, 8, TS);
  ctx.fillStyle = PAL[hot ? ORANGE : GREY];
  // brick courses
  for (let y = 0; y < TS; y += 4) {
    ctx.fillRect(X, Y + y + 3, 8, 1);
    ctx.fillRect(X + (((y >> 2) + r) & 1 ? 2 : 6), Y + y, 1, 3);
  }
  if (dmg > 0.01) {
    ctx.fillStyle = PAL[BLACK];
    const n = Math.floor(dmg * 14);
    for (let i = 0; i < n; i++) ctx.fillRect(X + Math.floor(hash(i, r, 4) * 4) * 2, Y + Math.floor(hash(r, i, 8) * TS), 2, 1);
  }
}
function drawWater(X, Y, c, r, t) {
  const surface = L.at(c, r - 1) !== '~';
  ctx.fillStyle = PAL[BLUE]; ctx.fillRect(X, Y + (surface ? 3 : 0), TS, TS - (surface ? 3 : 0));
  if (surface) {
    for (let px = 0; px < TS; px += 2) {
      const wv = Math.sin((c * TS + px) * 0.35 + t * 0.12);
      ctx.fillStyle = PAL[wv > 0.3 ? WHITE : LBLUE];
      ctx.fillRect(X + px, Y + 3 + (wv > 0 ? 0 : 1), 2, 1);
    }
  }
  for (let i = 0; i < 3; i++) {
    const px = Math.floor(hash(c, i, (t >> 4)) * 8) * 2, py = 5 + Math.floor(hash(i, r, (t >> 4)) * 10);
    ctx.fillStyle = PAL[LBLUE]; ctx.fillRect(X + px, Y + py, 2, 1);
  }
}
function drawHero(ox, oy, t) {
  let legs = 0;
  if (!H.onGround && G.state === 'play') legs = H.vy < -0.2 ? 2 : 3;
  else if (H.walkT && (input.left || input.right) && G.state === 'play') legs = ((H.walkT >> 3) & 1) ? 1 : 0;
  const rot = H.spin > 0.02 ? Math.floor(H.rotT) % 4 : 0;
  drawSpr(heroSpr[legs][rot], H.x - HERO_OX - ox, H.y - HERO_OY - oy, H.face < 0);
}

function renderHUD() {
  const y0 = PH;
  ctx.fillStyle = PAL[0]; ctx.fillRect(0, y0, VW, VH - PH);
  ctx.fillStyle = PAL[L.rock[0]]; ctx.fillRect(0, y0, VW, 2);
  ctx.fillStyle = PAL[L.rock[1]]; ctx.fillRect(0, y0 + 2, VW, 1);
  // power
  text('POWER', 16, y0 + 8, YELLOW);
  const bx = 52, bw = 252;
  ctx.fillStyle = PAL[DGREY]; ctx.fillRect(bx, y0 + 8, bw, 7);
  const pw = Math.round(bw * Math.max(0, H.power) / 2) * 2;
  const low = H.power < 0.2 && (G.t >> 3) & 1;
  ctx.fillStyle = PAL[low ? LRED : YELLOW]; ctx.fillRect(bx, y0 + 8, pw, 7);
  ctx.fillStyle = PAL[ORANGE]; ctx.fillRect(bx, y0 + 13, pw, 2);
  // lives
  for (let i = 0; i < Math.min(G.lives, 6); i++) drawSpr(heroIcon, 16 + i * 11, y0 + 22);
  // dynamite
  for (let i = 0; i < H.dyn; i++) {
    const x = 100 + i * 7;
    ctx.fillStyle = PAL[RED]; ctx.fillRect(x, y0 + 23, 4, 8);
    ctx.fillStyle = PAL[LRED]; ctx.fillRect(x, y0 + 23, 2, 8);
    ctx.fillStyle = PAL[WHITE]; ctx.fillRect(x, y0 + 25, 4, 1);
    ctx.fillStyle = PAL[GREY]; ctx.fillRect(x + 2, y0 + 21, 1, 2);
  }
  // score + level
  const sc = String(G.score).padStart(6, '0');
  text(sc, VW - 16 - textW(sc, 2), y0 + 21, WHITE, 2);
  text('LEVEL ' + levelNo(), 160, y0 + 23, LBLUE);
}

function renderTitle() {
  const t = G.t;
  // raster bars behind the logo
  const bars = [BLUE, LBLUE, CYAN, WHITE, CYAN, LBLUE, BLUE, BLACK, BROWN, ORANGE, LRED, YELLOW, WHITE, YELLOW, LRED, ORANGE, BROWN, BLACK];
  for (let y = 0; y < 40; y++) {
    const ci = bars[Math.floor((y + t * 0.5) / 2) % bars.length];
    ctx.fillStyle = PAL[ci]; ctx.fillRect(0, 12 + y, VW, 1);
  }
  ctx.fillStyle = PAL[0]; ctx.fillRect(0, 18, VW, 28);
  const logo = 'R.O.T.O.R.';
  const lx = Math.round((VW - textW(logo, 3)) / 2);
  text(logo, lx + 2, 22, BLUE, 3);
  // per-row colour cycling on the logo
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, VW, 200); ctx.clip();
  for (let row = 0; row < 7; row++) {
    ctx.save(); ctx.beginPath(); ctx.rect(0, 21 + row * 3, VW, 3); ctx.clip();
    text(logo, lx, 21, [WHITE, YELLOW, YELLOW, ORANGE, ORANGE, LRED, RED][(row + (t >> 3)) % 7], 3);
    ctx.restore();
  }
  ctx.restore();
  textC('RESCUE OPERATION THROUGH OLD ROCKSHAFTS', 58, LBLUE);

  // little scene: rescuer hovering, miner waiting
  ctx.fillStyle = PAL[ORANGE]; ctx.fillRect(40, 116, 240, 4);
  ctx.fillStyle = PAL[BROWN]; ctx.fillRect(40, 120, 240, 2);
  const hx = 70 + Math.round((Math.sin(t * 0.01) + 1) * 70), hy = 84 + Math.round(Math.sin(t * 0.05) * 4);
  drawSpr(heroSpr[3][Math.floor(t * 0.6) % 4], hx, hy, Math.cos(t * 0.01) < 0);
  drawSpr(minerSpr[(t >> 4) & 1 ? 1 : 2], 250, 98);
  drawSpr(batSpr[(t >> 3) & 1], 120 + Math.round(Math.sin(t * 0.03) * 40), 74);

  textC('LEVEL  < ' + (G.startSel + 1) + ' >', 130, WHITE);
  if ((t >> 5) & 1) textC('FEUER / LEERTASTE ZUM START', 144, YELLOW);
  textC('HIGHSCORE ' + String(hiscore).padStart(6, '0'), 160, LGREEN);
  textC('PFEILE: FLIEGEN   UNTEN: DYNAMIT   LEER: LASER', 176, GREY);
  textC('P: PAUSE   M: TON   LINKS/RECHTS: LEVEL', 186, GREY);
}

/* ------------------------------------------------------------------ */
/* Main loop: fixed 60 Hz simulation                                   */
/* ------------------------------------------------------------------ */
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  updateLoops();
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// debug/test hook
window.__rotor = { G, H, get L() { return L; }, LEVELS, startLevel: i => { G.levelIdx = i; startLevel(); } };
</script>
